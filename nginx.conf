# Nginx configuration for Laravel (sae) - Production
# Salin ke: /etc/nginx/conf.d/  atau /etc/nginx/sites-available/
# Path hosting: /www/wwwroot/test-app.smakpal.sch.id

server {
    listen 80;
    server_name test-app.smakpal.sch.id;

    root /www/wwwroot/test-app.smakpal.sch.id/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Redirect non-www → www (optional, sesuaikan)
    if ($host = test-app.smakpal.sch.id) {
        return 301 https://test-app.smakpal.sch.id$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File statis
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-fpm.sock;  # Ganti sesuai panel hosting Anda
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    # Blokir folder sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(app|bootstrap|config|database|resources|tests|vendor)/ {
        deny all;
        return 404;
    }
}
