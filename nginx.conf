# Nginx configuration for Laravel (sae)
# Salin ke: /etc/nginx/conf.d/  atau /etc/nginx/sites-available/
# Path hosting contoh (aaPanel / VPS): /www/wwwroot/sae.smakpal.sch.id
#
# PENTING (keamanan unggahan):
#   Direktori unggahan berisi berkas dari pengguna. Aplikasi sudah menolak ekstensi
#   berbahaya (hanya pdf/doc/docx/xls/xlsx/csv/txt/xml/zip + gambar hasil encode ulang),
#   TETAPI aturan di bawah adalah lapis kedua: PHP hanya boleh dijalankan untuk
#   /index.php. Dengan begitu, seandainya ada berkas .php lolos ke public/, ia tidak
#   akan pernah dieksekusi — hanya disajikan sebagai teks unduhan.

server {
    listen 80;
    listen [::]:80;
    server_name sae.smakpal.sch.id;

    # WAJIB arahkan ke folder public
    root /www/wwwroot/sae.smakpal.sch.id/public;
    index index.php index.html;

    # Jangan pernah tampilkan daftar isi direktori (mencegah enumerasi berkas unggahan)
    autoindex off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # URL Rewrite wajib Laravel (cegah 404 Nginx pada /install dsb)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File statis
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|webp|avif|gif|ico|svg|woff|woff2|ttf|otf|eot|pdf|zip)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM — HANYA entry point Laravel. Berkas .php lain (termasuk di folder
    # unggahan) tidak boleh dieksekusi.
    # Sesuaikan socket PHP server Anda: aaPanel PHP 8.3 = unix:/tmp/php-cgi-83.sock
    location = /index.php {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Lapis tambahan: berkas .php di luar index.php dilayani sebagai berkas biasa
    # (tidak dieksekusi). Balas 403 bila tetap dipaksa diakses sebagai skrip.
    location ~ \.php$ {
        deny all;
        return 403;
    }

    # Berkas dot & direktori internal
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Kode sumber Laravel tidak boleh disajikan (aktif bila root salah disetel).
    location ~ ^/(app|bootstrap|config|database|resources|tests|vendor)/ {
        deny all;
        return 404;
    }

    # Berkas sensitif di dalam storage (log, sesi, arsip backup) tidak boleh publik.
    location ~ ^/storage/(logs|framework|app/private|app/archives)/ {
        deny all;
        return 404;
    }
}
