# Nginx configuration for Laravel (sae) - Production
# Salin ke: /etc/nginx/conf.d/  atau /etc/nginx/sites-available/
# Path hosting contoh (aaPanel / VPS): /www/wwwroot/sae.smakpal.sch.id

server {
    listen 80;
    listen [::]:80;
    server_name sae.smakpal.sch.id;

    # WAJIB arahkan ke folder public
    root /www/wwwroot/sae.smakpal.sch.id/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # URL Rewrite wajib Laravel (cegah 404 Nginx pada /install dsb)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File statis
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM (Sesuaikan path socket PHP server Anda)
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock; # Contoh aaPanel PHP 8.3: /tmp/php-cgi-83.sock atau 127.0.0.1:9000
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Blokir akses file dot & direktori internal
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(app|bootstrap|config|database|resources|storage|tests|vendor)/ {
        deny all;
        return 404;
    }
}
