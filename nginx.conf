# Nginx configuration for Laravel (sae) - Production
# Untuk hosting Linux (bukan Laragon Windows)
# Salin ke: /etc/nginx/sites-available/sae
# Aktifkan: ln -s /etc/nginx/sites-available/sae /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name sae.app www.sae.app;  # Ganti dengan domain Anda

    # Redirect HTTP ke HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sae.app www.sae.app;  # Ganti dengan domain Anda

    # SSL - sesuaikan dengan sertifikat Anda
    ssl_certificate /etc/letsencrypt/live/sae.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sae.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Document root - WAJIB ke public/
    root /var/www/sae/public;
    index index.php;

    # Log
    access_log /var/log/nginx/sae-access.log;
    error_log  /var/log/nginx/sae-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Karakter utama Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File statis - cache lama
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # Sesuaikan versi PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Laravel butuh ini
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";  # Security: disable HTTP_PROXY header injection
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Blokir akses ke folder sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(app|bootstrap|config|database|resources|tests|vendor)/ {
        deny all;
        return 404;
    }

    # Vite dev server (hanya di development)
    # location /@vite {
    #     proxy_pass http://127.0.0.1:5173;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Handle preflight OPTIONS
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}
