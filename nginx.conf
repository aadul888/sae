# Nginx configuration for Laravel (sae)
# Place this in your Nginx sites-available and symlink to sites-enabled
# Adjust paths: /path/to/sae -> actual project path, e.g. C:/laragon/www/sae

server {
    listen 80;
    listen [::]:80;
    server_name sae.local;  # Ganti dengan domain Anda
    root "C:/laragon/www/sae/public";  # <-- Sesuaikan path proyek
    index index.php;

    # Log
    access_log "C:/laragon/www/sae/storage/logs/nginx-access.log";
    error_log  "C:/laragon/www/sae/storage/logs/nginx-error.log";

    # Karakteristik keamanan
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Redirect trailing slash
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File statis - cache lama
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        # Laragon biasanya pakai socket ini
        fastcgi_pass   127.0.0.1:9000;  # <-- Jika pakai port, ganti jika pakai socket
        # fastcgi_pass   unix:/run/php/php8.3-fpm.sock;  # <-- Alternatif jika pakai socket
        fastcgi_index    index.php;
        fastcgi_param    SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include          fastcgi_params;

        # Laravel butuh ini untuk routing yang benar
        fastcgi_param    HTTPS $https if_not_empty;
        fastcgi_param    HTTP_PROXY "http://127.0.0.1:9000";  # Jika butuh proxy
        fastcgi_read_timeout 300;
    }

    # Blokir akses ke folder sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(app|bootstrap|config|database|resources|tests|vendor)/ {
        deny all;
        return 404;
    }

    # Vite dev server (hanya di development)
    # Jika pakai `php artisan serve` + Vite dev, uncomment ini:
    # location /@vite {
    #     proxy_pass http://127.0.0.1:5173;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Handle preflight OPTIONS
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}
